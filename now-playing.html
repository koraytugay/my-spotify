<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Spotify Collection - Currently Playing</title>
    <meta name="description" content="Currently playing track showcase, large album cover art, and up-next queue">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="np-backdrop-aura" id="np-backdrop-aura"></div>
    <div class="container">
        <header>
            <div class="header-title">
                <svg class="spotify-icon" viewBox="0 0 24 24">
                    <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
                </svg>
                <h1>My Spotify Collection</h1>
            </div>
            
            <nav class="page-nav">
                <a href="index.html" class="nav-link">💚 Liked Songs</a>
                <a href="playlists.html" class="nav-link">📑 Playlists</a>
                <a href="albums.html" class="nav-link">💿 Saved Albums</a>
                <a href="artists.html" class="nav-link">👥 Artists</a>
                <a href="stats.html" class="nav-link">📊 Statistics</a>
                <a href="now-playing.html" class="nav-link active">▶ Currently Playing</a>
            </nav>
        </header>

        <!-- Loading State -->
        <div id="loading" class="loading-box">
            <div class="spinner"></div>
            <p>Loading playback state and queue...</p>
        </div>

        <!-- Main Showcase View -->
        <div id="now-playing-content" class="now-playing-wrapper" style="display: none;">
            <!-- Theme Toggle Bar -->
            <div class="now-playing-toolbar">
                <div class="queue-context-badge" id="queue-context-badge">Playing from Liked Songs</div>
                <div class="control-group" style="margin-left: auto;">
                    <label class="checkbox-toggle">
                        <input type="checkbox" id="dark-mode-toggle" onchange="toggleDarkMode(this.checked)">
                        Dark Mode
                    </label>
                </div>
            </div>

            <div class="now-playing-grid">
                <!-- Left: Big Artwork Showcase -->
                <div class="now-playing-hero-card">
                    <div class="hero-cover-container">
                        <img id="np-hero-cover" src="https://via.placeholder.com/400x400?text=No+Track" alt="Album Cover" class="hero-cover-img">
                        <div class="hero-eq-badge" id="np-hero-eq">
                            <span></span><span></span><span></span><span></span>
                        </div>
                    </div>

                    <div class="hero-details">
                        <h2 id="np-hero-title" class="hero-title">Select a Track</h2>
                        <div id="np-hero-artist" class="hero-artist">No Artist Selected</div>
                        <div id="np-hero-album" class="hero-album"></div>
                    </div>

                    <div class="hero-actions">
                        <button id="np-hero-prev" class="hero-ctrl-btn" title="Previous (Shortcut: P)">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                                <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                            </svg>
                        </button>
                        <button id="np-hero-play" class="hero-play-btn" title="Play / Pause (Shortcut: Space)">
                            <span id="np-hero-play-icon">▶</span>
                        </button>
                        <button id="np-hero-next" class="hero-ctrl-btn" title="Next (Shortcut: N)">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                                <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                            </svg>
                        </button>
                    </div>

                    <div class="hero-footer-links">
                        <a id="np-hero-spotify-link" href="https://open.spotify.com" target="_blank" rel="noopener noreferrer" class="mini-spotify-btn">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
                            </svg>
                            <span>Open on Spotify</span>
                        </a>
                    </div>
                </div>

                <!-- Right: Up Next Queue -->
                <div class="now-playing-queue-card">
                    <div class="queue-header">
                        <h3>Up Next in Queue</h3>
                        <span id="queue-count-badge" class="badge">0 tracks</span>
                    </div>

                    <div id="queue-track-list" class="queue-track-list">
                        <!-- Populated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="player.js"></script>
    <script src="now-playing.js"></script>
</body>
</html>
